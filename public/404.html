<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Not found — Hackathon Radar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127919;</text></svg>" />
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fa; --text: #14171f; --dim: #5b6474; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0e1116; --text: #e9edf4; --dim: #9aa4b5; --accent: #a8a2ff; }
      }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--text); line-height: 1.5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: 1.35rem; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { color: var(--dim); font-size: 0.9rem; margin: 0 0 20px; }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <p style="font-size: 2.5rem; margin-bottom: 4px">🎯</p>
      <h1>That page isn't here</h1>
      <p>
        The hackathon may have ended — listings are dropped a month after they finish — or the link
        was mistyped.
      </p>
      <a href="/">Browse every open hackathon →</a>
    </main>
  </body>
</html>
