name = "hackathon-radar"
compatibility_date = "2026-01-15"
pages_build_output_dir = "dist"

# Created with: wrangler d1 create hackathon-tracker
# The binding must stay "DB" — functions/api/tracker.ts reads env.DB.
[[d1_databases]]
binding = "DB"
database_name = "hackathon-tracker"
database_id = "546d832f-323f-4ad7-bea7-7eab0741921a"

# TRACKER_SECRET is a secret, not a var — set it with:
#   wrangler pages secret put TRACKER_SECRET
# (or in the Cloudflare dashboard under Settings → Variables and Secrets)
