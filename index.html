<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <title>Hackathon Radar — every online hackathon you can enter</title>
    <meta name="description" content="Every online hackathon you can enter, in one place — merged from Devpost, Devfolio, Unstop, MLH and ETHGlobal, filterable by prize, theme, deadline and eligibility." />
    <link rel="canonical" href="https://hackathon-radar-e0u.pages.dev/" />

    <!-- Shared links are how this spreads in hackathon communities, so they have to say what they are.
         functions/h/[slug].ts replaces these per event. Keep each tag on one line — that function rewrites them by regex. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hackathon Radar" />
    <meta property="og:url" content="https://hackathon-radar-e0u.pages.dev/" />
    <meta property="og:title" content="Hackathon Radar" />
    <meta property="og:description" content="Every online hackathon you can enter, in one place — merged from five platforms, filterable by prize, theme and deadline." />
    <meta property="og:image" content="https://hackathon-radar-e0u.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hackathon Radar — a project by Sepuri Sai Krishna, built as a web app on React and Cloudflare Pages." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hackathon Radar" />
    <meta name="twitter:description" content="Every online hackathon you can enter, in one place — merged from five platforms, filterable by prize, theme and deadline." />
    <meta name="twitter:image" content="https://hackathon-radar-e0u.pages.dev/og.png" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127919;</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
